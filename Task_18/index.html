<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>interactive Webpage</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <h1 id="username">
            Hello
        </h1>
    </header>
    <div class="hero-section">
        <div class="color-boxes">
            <div class="boxR" id="red">Red</div>
            <div class="boxB" id="blue">Blue</div>
            <div class="boxG" id="green">Green</div>
            <div class="boxY" id="yellow">Yellow</div>
        </div>
        <div class="greeting">
            <input type="text" class="nameInput" id="nameBox" placeholder="Enter Your Name">
            <button class="greet-btn" id="nameBtn" type="submit">Greet</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
