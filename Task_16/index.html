<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    max-width:100%;
    height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}
.stickyHeader{
    height: 10vh;
    border-radius: 8px;
    border: solid 2px rgba(234, 228, 228, 0.754);
    padding: 0 2em;
    justify-content: space-between;
    align-items: center;
    /* background-color: red; */
    min-width: 100%;
    position:sticky;
    display: flex;
}
#user{
    color: rgb(113, 111, 111);
}
#lgn-btn{
    height: 5vh;
    width:8vw;
    color: rgb(73, 155, 255);
    background-color:rgb(210, 242, 255);
    font-size: 1.5rem;
    border:none;
    border-radius: 30px;
}
.main{

    margin:2em;
    height:90vh;
    /* background-color: Blue; */
    overflow-y:auto;
    scrollbar-width: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
}
.search-bar{
    border-radius:20px;
background-color: white;
    display: flex;
    justify-content: flex-start;
    flex-direction: row;
    align-items: center;
    gap: 2rem;
    top:10px;
    position: sticky;
    border: solid 2px rgba(234, 228, 228, 0.754);
/* height: 15dvh; */            
    margin-bottom: 1.5rem;
    margin-top: 1rem;
}
#searchBar{
    padding-left:1.2em;
    color:black;
    font-size: 1em;
    border:none;
    border-radius: 10px;
    height: 4em;
    width: 20em;
    /* align-items: center; */
 background-color: rgba(57, 57, 57, 0.069);
}
/* #searchBar :focus{
    outline: none !important;
    box-shadow: none !important;
    border-color: white;
    border:none;
} */
.search-bar form{
    height:10vh;
    padding-left:1.5em;
    gap: 1.5em;
    display: flex;
    flex-direction: row;
    align-items: center;
}
.search-bar button{
    color: white;
    align-self: center;
    background-color: blueviolet;
    height: 4em;
    font-size:1em;
    width:10em;
    border: none ;
    border-radius: 10px;
}
.gridBody{
    margin:1.5em;
    top:40px;
}
#student-info{
    border-radius:20px;
    padding:1em;
    background-color:none;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap:1.5em;
}
.student-card{
    padding:1em;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    background-color: rgba(57, 57, 57, 0.069);
    height: 20dvh;
    border-radius:30px;
    font-size:2rem;
}

</style>
</head>
<body>
    <!-- Header -->
    <header class="stickyHeader">
        <h2 id="user" >Hi, Username</h2>
        <button id="lgn-btn">Login</button>
    </header>
    <!-- main -->
    <div class="main">
        <!--Search bar  -->
        <div class="search-bar">
            <form action="/search" method="get">
            <input type="search" id="searchBar" name="Searchbar" placeholder="Search">
            <button type="submit">Search</button>
           </form>
        </div>
        <!-- scrollable student grid -->
         <div class="gridBody">
              <div id="student-info">
               <!-- show student card here -->
            </div>
         </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
